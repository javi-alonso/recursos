#!/usr/sbin/nft -f

flush ruleset

define WAN = eth0
define LAN = eth1
define RED_LAN = 10.33.X.0/24
define ADMIN = 172.22.?.?

table inet filtro {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        iifname $LAN tcp dport 22 accept
        ip saddr $ADMIN tcp dport 22 accept
        ip saddr 172.22.65.146 tcp dport 22 accept   # gestión del laboratorio: no la toques
        iifname $LAN icmp type echo-request accept
        meta l4proto ipv6-icmp accept

        log prefix "nft input descartado: "
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        iifname $LAN oifname $WAN accept

        log prefix "nft forward descartado: "
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN ip saddr $RED_LAN counter masquerade
    }
}
